<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tracker</title>
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link 
        rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container-fluid">

            <a class="navbar-brand" href="{{ url_for('index') }}">
                Job Tracker
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('index') }}">
                            Jobs
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('companies') }}">
                            Companies
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link disabled" href="#">
                            Analytics
                        </a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>

    <main class="container-fluid py-4">
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="h5 card_title mb-3">
                    Search and Select Favorites
                </h2>

                <form
                    method="GET"
                    action="{{ url_for('companies') }}"
                >
                    <div class="row g-3 align-items-end">

                        <div class="col-12 col-md-8 col-lg-6">
                            <label for="company_search" class="form-label">
                                Search companies:
                            </label>

                            <input
                                type="text"
                                name="company_search"
                                id="company_search"
                                class="form-control"
                                placeholder="Enter a company name..."
                                value="{{ company_search }}"
                            >
                        </div>

                        <!-- <div class="col-12 col-md-auto">
                            <div class="form-check mb-2">
                                <input
                                    type="checkbox"
                                    name="favorites_only"
                                    id="favorites_only"
                                    class="form-check-input"
                                    value="1"
                                    {% if favorites_only %}checked{% endif %}
                                >

                                <label
                                    for="favorites_only"
                                    class="form-check-label"
                                >
                                    Favorites
                                </label>
                            </div>
                        </div> -->

                        <div class="col-12 col-md-auto">
                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                            >
                                Search
                            </button>
                        </div>

                        <div class="col-12 col-md-auto">
                            <a
                                href="{{ url_for('companies') }}"
                                class="btn btn-outline-secondary w-100"
                            >
                                Clear
                            </a>
                        </div>

                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="h5 mb-0">Companies</h2>

                    <span class="text-muted">
                        {{ companies|length }} companies
                    </span>
                </div>

                <div class="row g-3">
                    {% for company in companies %}
                        <div class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-2">
                            <div class="border rounded p-3 h-100 company-tile">

                                <div class="d-flex justify-content-between align-items-center gap-2">

                                    <a
                                        href="{{ url_for('company_detail', company_id=company['id']) }}"
                                        class="company-link"
                                    >
                                        {{ company["company"] }}
                                    </a>
                                    <form 
                                        action="{{ url_for('toggle_company_favorite', company_id=company['id']) }}"
                                        method="POST"
                                    >
                                        <button type="submit" class="btn btn-link p-0 text-decoration-none">
                                            {% if company["favorite"] == 1 %}
                                            ★
                                            {% else %}
                                            ☆
                                            {% endif %}
                                        </button>
                                    </form>

                                </div>

                            </div>
                        </div>
                    {% endfor %}
                </div>

            </div>
        </div>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        ></script>
        <script src="{{ url_for('static', filename='js/script.js')}}"></script>
    </main>
</body>
</html>
